<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KosherRadar - Kashrut information for restaurants in Israel</title>
    <meta
      name="description"
      content="KosherRadar is a crowdsourced directory of kashrut certificates for restaurants and food businesses in Israel."
    />
    <meta property="og:title" content="KosherRadar" />
    <meta
      property="og:description"
      content="Find verified kashrut certificate information for restaurants in Israel."
    />
    <meta property="og:type" content="website" />
    <script>
      // NEW (Milestone 5): set direction before React loads, so Hebrew does not flash as left-to-right.
      try {
        var savedLanguage = localStorage.getItem('kosherradar-language');
        var language =
          savedLanguage === 'he' || savedLanguage === 'en'
            ? savedLanguage
            : (navigator.language || '').toLowerCase().indexOf('he') === 0
              ? 'he'
              : 'en';
        document.documentElement.lang = language;
        document.documentElement.dir = language === 'he' ? 'rtl' : 'ltr';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
